services:
  - type: web
    name: area-seo-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUBLIC_SITE_URL
        value: https://area-maibab-public-site.onrender.com
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: REQUIRE_ADMIN_AUTH
        value: "true"
      - key: ADMIN_USER
        value: areaadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: area-seo-ai-db
          property: connectionString


databases:
  - name: area-seo-ai-db
    plan: free
    region: singapore
