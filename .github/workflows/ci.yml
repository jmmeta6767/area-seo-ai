name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Install browser QA tools
        timeout-minutes: 12
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Partner workflow on mobile and desktop (Chromium)
        run: AREA_BROWSER=chromium node tests/partners-browser.js
      - name: Partner workflow on mobile and desktop (WebKit)
        run: AREA_BROWSER=webkit node tests/partners-browser.js
